version: '3.8'

services:
  minio:
    image: minio/minio
    container_name: webgiare_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: always

  webgiare_media:
    build: .
    container_name: webgiare_media_server
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: uploads
      # Public endpoint for browser access (localhost)
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
    depends_on:
      - minio
    restart: always

volumes:
  minio_data:
