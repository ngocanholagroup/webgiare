services:
  # 1. Web Server (PHP + Apache)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webgiare_app
    ports:
      - "8080:80"  # Truy cập web qua http://localhost:8080
    volumes:
      - ./src:/var/www/html # Mount code từ máy thật vào container để sửa code live
      - ./.env:/var/www/.env # Mount file .env để PHP có thể đọc được cấu hình
      - ./docker:/var/www/docker # Mount thư mục docker để chạy script restore
      - ./docker/backups:/var/www/backups # Mount thư mục backups để PHP đọc
      - /var/run/docker.sock:/var/run/docker.sock # Mount Docker socket để PHP gọi lệnh docker
      # - webgiare_uploads:/var/www/html/uploads # (DISABLED) Dùng trực tiếp thư mục src/uploads để dễ quản lý file trên host
    depends_on:
      db:
        condition: service_healthy
    networks:
      - webgiare_net
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - MINIO_ENDPOINT=minio
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET_NAME=uploads
      - MINIO_PUBLIC_ENDPOINT=http://localhost:9000

  # 2. Database (MySQL)
  db:
    image: mysql:8.0
    container_name: webgiare_db
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - ./docker/mysql_data:/var/lib/mysql           # Mount thư mục từ host để dễ quản lý
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql  # Tự động chạy init.sql khi khởi tạo DB lần đầu
    networks:
      - webgiare_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Quản trị DB (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: webgiare_pma
    env_file:
      - .env
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8081:80" # Truy cập phpMyAdmin qua http://localhost:8081
    depends_on:
      - db
    networks:
      - webgiare_net

  # 4. Umami Analytics (Database PostgreSQL)
  umami_db:
    image: postgres:15-alpine
    container_name: umami_db
    environment:
      POSTGRES_DB: ${UMAMI_DB}
      POSTGRES_USER: ${UMAMI_USER}
      POSTGRES_PASSWORD: ${UMAMI_PASSWORD}
    volumes:
      - ./docker/umami_postgres_data:/var/lib/postgresql/data
    networks:
      - webgiare_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UMAMI_USER} -d ${UMAMI_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # 5. Umami Analytics (App)
  umami_app:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami_app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${UMAMI_USER}:${UMAMI_PASSWORD}@umami_db:5432/${UMAMI_DB}
      DATABASE_TYPE: postgresql
      APP_SECRET: ${APP_SECRET:-replace-me-with-a-random-string}
    ports:
      - "3000:3000" # Truy cập Umami qua http://localhost:3000
    depends_on:
      umami_db:
        condition: service_healthy
    networks:
      - webgiare_net
    restart: always

  # 6. MinIO (Object Storage)
  minio:
    image: minio/minio
    container_name: webgiare_minio
    command: server /data --console-address ":9001" --address ":9000"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./docker/minio_data:/data
    networks:
      - webgiare_net
    restart: always

# Khai báo Volumes và Networks
volumes:
  # db_data: # Đã chuyển sang mount thư mục host
  # umami_db_data: # Đã chuyển sang mount thư mục host
  webgiare_uploads:
  # minio_data: # Dùng local folder ./docker/minio_data thay vì volume để dễ quản lý

networks:
  webgiare_net:
    driver: bridge
